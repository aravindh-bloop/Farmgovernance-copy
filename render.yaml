# Render Blueprint — deploys backend (FastAPI) + kiosk frontend + web portal (static sites)
# Usage: Render Dashboard → New → Blueprint → connect this repo → Apply.
# The two static frontends automatically read the backend's public URL
# (fromService → RENDER_EXTERNAL_URL) and bake it into the build via VITE_API_BASE_URL.

services:
  # ---------- FastAPI Backend ----------
  - type: web
    name: coop-assistant-backend
    runtime: python
    plan: free                 # change to starter for more RAM (chromadb/torch is heavy)
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEFAULT_LLM_PROVIDER
        value: gemini
      - key: OFFLINE_MODE
        value: "false"
      - key: ENABLE_DENSE_SEARCH
        value: "false"         # skip chromadb/torch init + model download at startup (keyword retrieval still works)
      - key: GEMINI_API_KEY
        sync: false            # set in Render dashboard → Environment
      - key: GROQ_API_KEY
        sync: false            # free key from console.groq.com — used automatically when Gemini is throttled
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b   # best free model for Tamil/Telugu/Marathi/Hindi output
      - key: SARVAM_API_KEY
        sync: false
      - key: BHASHINI_USER_ID
        sync: false            # Bhashini Govt. NMT pipeline — set in Render dashboard → Environment
      - key: BHASHINI_INFERENCE_API_KEY
        sync: false

  # ---------- Kiosk Frontend (static) ----------
  - type: web
    name: coop-assistant-kiosk
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA fallback — serve index.html for all non-file routes
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: coop-assistant-backend
          envVarKey: RENDER_EXTERNAL_URL

  # ---------- Citizen Web Portal (static) ----------
  - type: web
    name: coop-assistant-web
    runtime: static
    rootDir: frontend-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA fallback — serve index.html for all non-file routes
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: coop-assistant-backend
          envVarKey: RENDER_EXTERNAL_URL
