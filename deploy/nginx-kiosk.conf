# nginx site — serves the built kiosk frontend and proxies the API
# Install: sudo cp deploy/nginx-kiosk.conf /etc/nginx/sites-available/kiosk
#          sudo ln -sf /etc/nginx/sites-available/kiosk /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    # Built kiosk frontend (production build of ./frontend)
    root /var/www/kiosk;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to FastAPI backend
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25m;   # voice uploads
        proxy_read_timeout 120s;    # LLM/TTS can be slow
    }

    # If any code references absolute /tts or /voice paths adjust similarly.
}
